<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Course - Masterclass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="first-step">
        <header class="header">
            <img src="image/logo_mobile_black 1.png" alt="Cinema Logo">
        </header>

        <main class="first-pharagraf">
            <section class="pharagraf">
                <div class="pharagraf-item">
                    <img src="image/globe.png" class="pharagraf-image" alt="Online">
                    <span class="meta-label">онлайн-курс</span>
                </div>
                <div class="pharagraf-item">
                    <img src="image/img_135744.png" class="pharagraf-image" alt="Duration">
                    <span class="meta-label">18 часов</span>
                </div>
                <div class="pharagraf-item">
                    <img src="image/calendar_2.png" class="pharagraf-image" alt="Date">
                    <span class="meta-label">8 сентября</span>
                </div>
            </section>

            <section class="second-pharagraf">
                <div class="image">
                    <img src="image/Group 23.png" alt="Image">
                </div>
                
                <div class="content">
                    <h1 class="pharagraf-title">Как смотреть кино</h1>
                    <p class="pharagraf-text">
                        За 8 занятий станем активными зрителями
                        <br>и разберёмся в кинопроцессе
                    </p>
                </div>
            </section>

            <div class="blue-box">
                <p class="blue-box-text">
                    Зритель для меня<br>
                    не потребитель моей продукции,<br>
                    не судья, а соучастник<br>
                    творчества, соавтор.
                </p>
                <span class="blue-box-author">Андрей Тарковский</span>
            </div>
        </main>
    </div>
</body>
</html>
